<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — getkeyd</title>

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://unpkg.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: https:;
    connect-src 'self' https://data.wa.gov https://geocoding.geo.census.gov https://api.census.gov https://nominatim.openstreetmap.org https://photon.komoot.io https://overpass-api.de https://api.weather.gov https://hazards.fema.gov https://gismaps.kingcounty.gov https://formspree.io https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com http://localhost:3001;
    frame-src https://www.youtube-nocookie.com https://accounts.google.com;
    media-src 'self';
    base-uri 'self';
    form-action 'self' https://formspree.io;
    object-src 'none';
  " />
  <meta name="description" content="Log in to getkeyd to save your progress and goals across devices." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=5" />
  <link rel="canonical" href="https://getkeyd.app/login.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="getkeyd" />
  <meta property="og:title" content="Log in — getkeyd" />
  <meta property="og:description" content="Log in to getkeyd to save your progress and goals across devices." />
  <meta property="og:url" content="https://getkeyd.app/login.html" />
  <meta property="og:image" content="https://getkeyd.app/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Log in — getkeyd" />
  <meta name="twitter:description" content="Log in to getkeyd to save your progress and goals across devices." />
  <meta name="twitter:image" content="https://getkeyd.app/assets/og-image.png" />
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap" id="main">
    <section class="section center-page">
      <div class="panel auth-card">
        <div class="auth-logo">🔑</div>
        <h1 id="auth-title">Welcome back</h1>
        <p class="sub" id="auth-sub" style="margin-bottom:4px">Log in to pick up where you left off.</p>

        <button type="button" id="google-signin" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.3 13.3 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.2-9.9 6.2-17.4z"/>
            <path fill="#FBBC05" d="M10.5 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.9-6.1C1 15.9 0 19.8 0 24s1 8.1 2.6 11.4l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.4-5.7c-2.1 1.4-4.8 2.2-8.1 2.2-6.3 0-11.7-3.8-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-divider"><span>or</span></div>

        <form id="auth-form" novalidate>
          <label id="username-field" class="hidden">
            Username
            <input type="text" id="auth-username" name="username" placeholder="Pick a display name" autocomplete="nickname" />
          </label>
          <label>
            Email
            <input type="email" id="auth-email" name="email" placeholder="you@email.com" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" id="auth-password" name="password" placeholder="At least 6 characters" autocomplete="current-password" minlength="6" required />
          </label>
          <div id="auth-error" class="auth-error hidden" role="alert"></div>
          <button type="submit" id="auth-submit" class="btn primary">Log in</button>
        </form>

        <p class="auth-alt"><a href="#" id="forgot-pw-link">Forgot password?</a></p>

        <div id="forgot-pw-section" class="hidden">
          <div class="auth-logo">📧</div>
          <h2>Reset your password</h2>
          <p class="sub" style="margin-bottom:4px">Enter your email and we'll send you a reset link.</p>
          <form id="forgot-pw-form" novalidate>
            <label>
              Email
              <input type="email" id="forgot-pw-email" name="email" placeholder="you@email.com" autocomplete="email" required />
            </label>
            <div id="forgot-pw-error" class="auth-error hidden" role="alert"></div>
            <div id="forgot-pw-success" class="auth-error hidden" style="background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep)" role="status"></div>
            <button type="submit" class="btn primary">Send reset link</button>
          </form>
          <p class="auth-alt"><a href="#" id="forgot-pw-back">Back to login</a></p>
        </div>

        <p class="auth-alt" id="auth-toggle-text">Don't have an account? <a href="#" id="auth-toggle">Sign up</a></p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/helpers.js"></script>
  <script src="js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
